name: Model Metadata Validation
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('.').rglob('*.json'))
          assert files, 'no JSON metadata found'
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
              print('validated', path)
          PY
